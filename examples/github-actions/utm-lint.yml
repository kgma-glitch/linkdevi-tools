# Copy to .github/workflows/utm-lint.yml in a checkout of this tools package.
# For the LinkDevi monorepo, set defaults.run.working-directory to
# integrations/linkdevi-tools. No LinkDevi key is required.
name: Check campaign UTM links
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Check UTM links without creating resources
        run: node dist/cli.js utm lint examples/utm-links.csv --format github --strict
